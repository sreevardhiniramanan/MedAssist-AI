<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MedAssist AI | Login</title>

    <link rel="stylesheet" href="../css/login.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Left Side -->

    <div class="left-panel">

        <h1>🏥 MedAssist AI</h1>

        <h2>Welcome Back!</h2>

        <p>

            Securely access your medical records,
            appointments, AI Assistant,
            prescriptions and lab reports.

        </p>

    </div>

    <!-- Right Side -->

    <div class="login-box">

        <h2>Login</h2>

        <form>

            <div class="input-box">

                <i class="fa-solid fa-envelope"></i>

                <input
                type="email"
                placeholder="Email Address"
                required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                type="password"
                placeholder="Password"
                required>

            </div>

            <button>

                Login

            </button>

            <a href="#">

                Forgot Password?

            </a>

            <p>

                Don't have an account?

                <a href="#">Register</a>

            </p>

        </form>

    </div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
